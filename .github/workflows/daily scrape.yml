name: Daily Volora ETL Pipeline

# This dictates WHEN the script runs
on:
  schedule:
    # Runs at 02:00 UTC every day (04:00 AM SAST)
    - cron: '0 2 * * *' 
  workflow_dispatch: # This adds a manual "Run" button to test it

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the R language on the server
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      # 3. Install necessary Linux system tools for R packages to compile
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpq-dev

      # 4. Install your specific R packages
      - name: Install R packages
        run: |
          install.packages(c("rvest", "tibble", "tidyverse", "httr", "jsonlite", "DBI", "RPostgres", "stringr"))
        shell: Rscript {0}

      # 5. Run the script and inject the hidden secrets
      - name: Run Volora Pipeline
        env:
          SUPABASE_PWD: ${{ secrets.SUPABASE_PWD }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: Rscript pipeline.R
